name: ninja build

on:
  workflow_dispatch:

jobs:
  interactive-shell:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Terminal SSH Access Authorized Key Setup
      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PUBLIC_KEY }}
          known_hosts: unneeded

      # Official Ngrok Install & Tunnel Setup
      - name: Start Ngrok Tunnel
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          # Install Ngrok via official package manager
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y

          # Add Authtoken & Start Tunnel
          ngrok config add-authtoken $NGROK_AUTHTOKEN
          ngrok tcp 22 --log=stdout > ngrok.log &
          sleep 5

          # Print Connection Command
          echo "=========================================="
          curl -s http://localhost:4040/api/tunnels | grep -o 'tcp://[^"]*'
          echo "=========================================="

          # Keep session alive non-stop
          tail -f /dev/null

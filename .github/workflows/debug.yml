name: Zero-Lag Terminal (Tailscale)

on:
  workflow_dispatch:

jobs:
  interactive-shell:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Tailscale Setup
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      # Signal trap ke saath clean infinite wait loop
      - name: Keep Alive
        run: |
          echo "VM Connected to Tailscale! System non-stop chalta rahega..."
          tail -f /dev/null
